name: E493 advisory lock quiescence falsification

on:
  push:
    branches:
      - research/e493-advisory-lock-quiescence-20261102
  pull_request:
    paths:
      - 'research/e493_lock_identity_probe.py'
      - 'tests/test_e493_lock_identity_probe.py'
      - '.github/workflows/e493-python-lock.yml'

permissions:
  contents: read

jobs:
  lock-quiescence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile research modules
        run: python -m py_compile research/e477_pinned_registry_snapshot.py research/e490_nofollow_path.py research/e491_permission_boundary_probe.py research/e492_checkpoint_mac_gate.py research/e493_lock_identity_probe.py
      - name: Inherited E477 tests
        run: python -m unittest discover -s tests -p 'test_e477_pinned_registry_snapshot.py' -v
      - name: Inherited E487 tests
        run: python -m unittest discover -s tests -p 'test_e487_publication_recovery_probe.py' -v
      - name: Inherited E490 tests
        run: python -m unittest discover -s tests -p 'test_e490_nofollow_path.py' -v
      - name: Inherited E491 tests
        run: python -m unittest discover -s tests -p 'test_e491_permission_boundary_probe.py' -v
      - name: Inherited E492 tests
        run: python -m unittest discover -s tests -p 'test_e492_checkpoint_mac_gate.py' -v
      - name: E493 advisory lock tests
        run: python -m unittest discover -s tests -p 'test_e493_lock_identity_probe.py' -v
