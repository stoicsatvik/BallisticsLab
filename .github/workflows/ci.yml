name: C CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: E308 strict finite-math contract (GCC/Clang)
        run: python3 tools/e308_finite_math_contract.py
